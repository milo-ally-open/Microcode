name: Windows desktop release candidate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build and validate Windows x64 candidate
        run: bun run desktop:release:windows
      - name: Upload validated candidate and checksum
        uses: actions/upload-artifact@v4
        with:
          name: microcode-desktop-windows-x64
          path: |
            dist/releases/microcode-desktop-v*-windows-x64.zip
            dist/releases/microcode-desktop-v*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
